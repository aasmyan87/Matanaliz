<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540" role="img" aria-labelledby="title desc">
<title id="title">Следствие 9°: два разных применения принципа Архимеда</title>
<desc id="desc">Две раздельные числовые оси показывают роли n и m. Первая ось, с шагом d=b−a=0,15 от нуля, использует Архимед для x=1 и получает 6d≤1&lt;7d, поэтому n=7 и 1/n&lt;d. Вторая ось — настоящий интервал (a,b)=(1,4;1,55): сетка m/7 даёт первую отметку 10/7≈1,4286 внутри него.</desc>
<defs>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}
    .math{font-family:Cambria,'Times New Roman',serif}
    .muted{fill:#5b6678}
    .blue{fill:#1d4ed8}
    .green{fill:#047857}
    .orange{fill:#c2410c}
    .red{fill:#b91c1c}
  </style>
  <marker id="axis" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#334155"/></marker>
</defs>
<rect width="1800" height="1540" fill="#eef3f9"/>
<rect x="24" y="24" width="1752" height="1492" rx="30" fill="#fff" stroke="#d7e0eb" stroke-width="3"/>
<text x="72" y="88" font-size="46" font-weight="700">Следствие 9°: здесь две разные числовые оси</text>
<text x="74" y="132" font-size="25" class="muted">Пример: a = 1,4, b = 1,55. Сначала выбирается знаменатель n, потом находится числитель m.</text>

<!-- Stage 1 -->
<rect x="66" y="168" width="1668" height="590" rx="24" fill="#f8fafc" stroke="#d8e1ec" stroke-width="3"/>
<text x="104" y="220" font-size="32" font-weight="700" fill="#1d4ed8">Шаг 1. Выбираем n по ширине интервала</text>
<text x="106" y="266" font-size="26" class="math">d = b − a = 1,55 − 1,4 = 0,15. По 7° выбираем n так, чтобы 1/n &lt; d.</text>
<text x="106" y="308" font-size="24" class="muted">Это вспомогательная ось от 0 до 1: она показывает, как 6° даёт знаменатель. Это не отрезок [a,b].</text>
<text x="106" y="350" font-size="26" class="math">Применяем 6° с h = d = 0,15 и x = 1:  (k − 1)d ≤ 1 &lt; kd.</text>
<text x="106" y="392" font-size="26" class="math">Здесь k = 7, поэтому берём n = 7:  6·0,15 = 0,9 ≤ 1 &lt; 1,05 = 7·0,15.</text>

<!-- auxiliary axis: x = 250 + 900*x -->
<rect x="1060" y="466" width="135" height="76" rx="12" fill="#fff0cc" stroke="#eab84b" stroke-width="2"/>
<text x="1127" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">ячейка</text>
<text x="1127" y="523" text-anchor="middle" font-size="20" fill="#92400e">[6d; 7d)</text>
<line x1="220" y1="510" x2="1480" y2="510" stroke="#334155" stroke-width="5" marker-end="url(#axis)"/>
<rect x="1060" y="488" width="135" height="44" fill="#fbbf24" opacity="0.28"/>
<g stroke="#64748b" stroke-width="2.5">
  <path d="M250 490v40M385 490v40M520 490v40M655 490v40M790 490v40M925 490v40M1060 490v40M1195 490v40M1330 490v40"/>
</g>
<line x1="1150" y1="444" x2="1150" y2="526" stroke="#b45309" stroke-width="4" stroke-dasharray="8 6"/>
<circle cx="1150" cy="510" r="11" fill="#b45309" stroke="#fff" stroke-width="4"/>
<g font-size="22" text-anchor="middle" class="muted">
  <text x="250" y="576">0</text>
  <text x="520" y="576">2d = 0,3</text>
  <text x="790" y="576">4d = 0,6</text>
  <text x="1060" y="576">6d = 0,9</text>
  <text x="1195" y="576">7d = 1,05</text>
  <text x="1330" y="576">8d = 1,2</text>
</g>
<text x="1150" y="440" text-anchor="middle" font-size="25" font-weight="700" fill="#92400e">x = 1</text>
<text x="106" y="632" font-size="25" class="math" font-weight="700">Отсюда 1 &lt; nd, то есть 1/n &lt; d = b − a.</text>
<text x="106" y="684" font-size="23" class="muted">Здесь мы пока получили только n. Точки a, b и искомого r на этой оси нет.</text>

<!-- Stage 2 -->
<rect x="66" y="788" width="1668" height="676" rx="24" fill="#fff" stroke="#bfd7f0" stroke-width="3"/>
<text x="104" y="842" font-size="32" font-weight="700" fill="#1d4ed8">Шаг 2. С отдельной сеткой  m/n  находим r правее a</text>
<text x="106" y="888" font-size="26" class="math">Теперь n = 7 зафиксировано. Применяем 6° заново: h = 1/7, x = a = 1,4.</text>
<text x="106" y="930" font-size="26" class="math">Получаем  (m − 1)/7 ≤ 1,4 &lt; m/7. Здесь m = 10, поэтому r = 10/7.</text>
<text x="106" y="970" font-size="23" class="muted">Эта ось уже показывает настоящий интервал (a,b) и отметки рациональной сетки m/7.</text>
<text x="106" y="1010" font-size="24" class="math">Шаг сетки 1/7 ≈ 0,143 &lt; b − a = 0,15.</text>

<!-- actual interval axis: x = 300 + 2500*(value-1.2) -->
<rect x="800" y="1052" width="375" height="76" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
<text x="987.5" y="1081" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">искомый интервал (a,b)</text>
<text x="987.5" y="1110" text-anchor="middle" font-size="21" fill="#9a3412">b − a = 0,15</text>
<rect x="514.3" y="1140" width="357.2" height="54" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6"/>
<text x="692.9" y="1175" text-anchor="middle" font-size="21" font-weight="700" fill="#1e40af">ячейка [9/7; 10/7)</text>
<line x1="240" y1="1170" x2="1510" y2="1170" stroke="#334155" stroke-width="5" marker-end="url(#axis)"/>
<rect x="800" y="1148" width="375" height="44" fill="#fdba74" opacity="0.30"/>
<g stroke="#64748b" stroke-width="3">
  <path d="M514.3 1148v44M800 1148v44M871.4 1148v44M1175 1148v44M1228.6 1148v44"/>
</g>
<line x1="800" y1="1042" x2="800" y2="1198" stroke="#c2410c" stroke-width="4" stroke-dasharray="8 6"/>
<line x1="1175" y1="1042" x2="1175" y2="1198" stroke="#c2410c" stroke-width="4" stroke-dasharray="8 6"/>
<circle cx="800" cy="1170" r="10" fill="#fff" stroke="#c2410c" stroke-width="4"/>
<circle cx="871.4" cy="1170" r="12" fill="#059669" stroke="#fff" stroke-width="4"/>
<circle cx="1175" cy="1170" r="10" fill="#fff" stroke="#c2410c" stroke-width="4"/>
<circle cx="1228.6" cy="1170" r="9" fill="#64748b"/>
<g font-size="23" text-anchor="middle">
  <text x="514.3" y="1234" class="muted">9/7 ≈ 1,286</text>
  <text x="800" y="1282" font-weight="700" class="orange">a = 1,4</text>
  <text x="871.4" y="1234" font-weight="700" class="green">r = 10/7 ≈ 1,429</text>
  <text x="1175" y="1282" font-weight="700" class="orange">b = 1,55</text>
  <text x="1228.6" y="1234" class="muted">11/7 ≈ 1,571</text>
</g>
<line x1="800" y1="1332" x2="871.4" y2="1332" stroke="#047857" stroke-width="4" marker-start="url(#axis)" marker-end="url(#axis)"/>
<text x="930" y="1340" font-size="23" font-weight="700" class="green">r − a ≈ 0,029</text>
<text x="106" y="1408" font-size="27" class="math" font-weight="700">1,4 = a &lt; 10/7 ≈ 1,429 &lt; 1,55 = b; значит r = 10/7 ∈ ℚ подходит.</text>
</svg>
