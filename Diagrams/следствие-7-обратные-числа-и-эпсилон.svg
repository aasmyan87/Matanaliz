<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
<title id="title">Следствие 7°: из принципа Архимеда получается 1/n &lt; ε</title>
<desc id="desc">Пример ε = 0,4. Верхняя ось: принцип Архимеда с h = ε = 0,4 и x = 1 даёт k = 3, потому что (3−1)·0,4 = 0,8 ≤ 1 &lt; 1,2 = 3·0,4. Нижняя ось: точка 1/3 ≈ 0,333 лежит левее ε = 0,4, то есть n = 3 подходит: 0 &lt; 1/3 &lt; ε.</desc>
<defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}
.math{font-family:Cambria,'Times New Roman',serif}
.muted{fill:#64748b}
</style>
</defs>

<rect width="1600" height="1240" fill="#f3f6fb"/>
<rect x="24" y="20" width="1552" height="1200" rx="28" fill="#ffffff" stroke="#dbe3ef" stroke-width="2"/>

<text x="60" y="74" font-size="40" font-weight="700">Следствие 7°: из принципа Архимеда — 1/n &lt; ε</text>
<text x="60" y="116" font-size="21" class="muted">Зорич, т. 1, гл. II, § 2, п. 3, 7° (с. 80) · пример ε = 0,4, n = 3 · обе оси в одном масштабе (1 единица = 900 px)</text>

<!-- формулировка -->
<rect x="60" y="142" width="1480" height="104" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="90" y="176" font-size="20" font-weight="700" fill="#1d4ed8">Формулировка (7°)</text>
<text x="90" y="218" font-size="27" class="math">Для любого ε &gt; 0 существует n ∈ ℕ такое, что 0 &lt; 1/n &lt; ε.</text>

<!-- ключевая переформулировка -->
<rect x="60" y="262" width="1480" height="98" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<text x="90" y="298" font-size="23" class="math">Ключ: 1/n &lt; ε ⟺ 1 &lt; nε. Нужно кратное ε, переросшее 1, — это ровно 6° при h = ε и x = 1.</text>
<text x="90" y="338" font-size="20" class="muted">6° даёт целое k: (k − 1)ε ≤ 1 &lt; kε. Остаётся проверить, что k &gt; 0, и положить n = k.</text>

<!-- ПАНЕЛЬ A -->
<text x="60" y="434" font-size="24" font-weight="700">Шаг 1. Принцип Архимеда при h = ε = 0,4 и x = 1 даёт k = 3</text>

<!-- скобка h -->
<line x1="140" y1="482" x2="140" y2="492" stroke="#7c3aed" stroke-width="2.5"/>
<line x1="500" y1="482" x2="500" y2="492" stroke="#7c3aed" stroke-width="2.5"/>
<line x1="140" y1="482" x2="500" y2="482" stroke="#7c3aed" stroke-width="3"/>
<text x="320" y="468" text-anchor="middle" font-size="21" font-weight="700" fill="#6d28d9">h = ε = 0,4 (шаг)</text>

<!-- два полных шага -->
<line x1="140" y1="534" x2="140" y2="544" stroke="#2563eb" stroke-width="2.5"/>
<line x1="860" y1="534" x2="860" y2="544" stroke="#2563eb" stroke-width="2.5"/>
<line x1="140" y1="534" x2="860" y2="534" stroke="#2563eb" stroke-width="3"/>
<text x="500" y="520" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">2 полных шага: 2ε = 0,8</text>

<!-- клетка -->
<rect x="860" y="580" width="360" height="48" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>

<!-- ось A -->
<line x1="100" y1="604" x2="1380" y2="604" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
<g stroke="#94a3b8" stroke-width="2.5">
<line x1="140" y1="592" x2="140" y2="616"/>
<line x1="500" y1="592" x2="500" y2="616"/>
<line x1="860" y1="592" x2="860" y2="616"/>
<line x1="1220" y1="592" x2="1220" y2="616"/>
</g>
<g font-size="20" class="muted" text-anchor="middle">
<text x="140" y="648">0</text>
<text x="500" y="648">0,4</text>
<text x="860" y="648">0,8</text>
<text x="1220" y="648">1,2</text>
</g>

<!-- точка x -->
<circle cx="1040" cy="604" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
<text x="1040" y="568" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">x = 1</text>

<text x="1040" y="686" text-anchor="middle" font-size="19" class="muted">клетка [(k − 1)h, kh) = [0,8; 1,2)</text>

<!-- остаток -->
<line x1="860" y1="712" x2="860" y2="732" stroke="#059669" stroke-width="2.5"/>
<line x1="1040" y1="712" x2="1040" y2="732" stroke="#059669" stroke-width="2.5"/>
<line x1="860" y1="722" x2="1040" y2="722" stroke="#059669" stroke-width="3"/>
<text x="950" y="758" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">остаток 1 − 0,8 = 0,2 &lt; h</text>

<text x="60" y="806" font-size="25" class="math">(3 − 1)·0,4 = 0,8 ≤ 1 &lt; 1,2 = 3·0,4 ⟹ k = 3; так как k &gt; 0, то k ∈ ℕ, и n := k = 3.</text>

<!-- ПАНЕЛЬ B -->
<text x="60" y="872" font-size="24" font-weight="700">Шаг 2. Подставляем n = 3: точка 1/3 попадает левее ε = 0,4</text>

<!-- скобка 0 .. 1/n -->
<line x1="140" y1="916" x2="140" y2="926" stroke="#059669" stroke-width="2.5"/>
<line x1="440" y1="916" x2="440" y2="926" stroke="#059669" stroke-width="2.5"/>
<line x1="140" y1="916" x2="440" y2="916" stroke="#059669" stroke-width="3"/>
<text x="290" y="902" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">0 &lt; 1/n = 1/3 ≈ 0,333</text>

<!-- ось B -->
<line x1="100" y1="970" x2="1380" y2="970" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
<g stroke="#94a3b8" stroke-width="2.5">
<line x1="140" y1="958" x2="140" y2="982"/>
<line x1="440" y1="958" x2="440" y2="982"/>
<line x1="590" y1="958" x2="590" y2="982"/>
<line x1="1040" y1="958" x2="1040" y2="982"/>
</g>
<g font-size="20" class="muted" text-anchor="middle">
<text x="140" y="1014">0</text>
<text x="440" y="1014">1/3 ≈ 0,333</text>
<text x="590" y="1014">1/2</text>
<text x="1040" y="1014">1</text>
</g>

<!-- ε -->
<line x1="500" y1="878" x2="500" y2="1004" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="514" y="932" font-size="21" font-weight="700" fill="#b91c1c">ε = 0,4</text>

<!-- итог -->
<rect x="60" y="1046" width="1480" height="78" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<text x="90" y="1096" font-size="25" class="math">0 &lt; 1/3 ≈ 0,333 &lt; 0,4 = ε — для ε = 0,4 число n = 3 подходит.</text>

<text x="60" y="1176" font-size="19" class="muted">Меньше ε — больше n: при ε = 0,01 то же 6° даёт k = 101, так как 100·0,01 = 1,00 ≤ 1 &lt; 1,01 = 101·0,01; значит n = 101 и 1/101 ≈ 0,0099 &lt; 0,01.</text>
</svg>
