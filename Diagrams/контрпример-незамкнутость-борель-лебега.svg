<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Почему без замкнутости лемма неверна: множество (0,1] и интервалы (1/n; 2)</title>
<desc id="desc">Показаны интервалы U_n = (1/n; 2) для n = 1,…,6. Их объединение равно (1/6; 2); точка 1/7 лежит в (0,1], но не покрыта. Для любого конечного набора интервалов объединение равно (1/N; 2), где N — наибольший номер, поэтому конечного подпокрытия нет.</desc>
<defs>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.math { font-family: Cambria, 'Times New Roman', serif; }
.muted { fill: #64748b; }
</style>
</defs>

<rect width="1600" height="820" fill="#f4f7fb"/>
<rect x="30" y="25" width="1540" height="770" rx="24" fill="#ffffff" stroke="#dbe3ef" stroke-width="2"/>

<text x="70" y="72" font-size="34" font-weight="700">Почему нужна замкнутость: (0,1] и интервалы (1/n; 2)</text>
<text x="70" y="108" font-size="19" class="muted">Замкнутость [a,b] в лемме существенна: предельная точка 1/n → 0 не принадлежит (0,1]</text>

<!-- интервалы U_n -->
<g>
  <line x1="1180" y1="172" x2="1372" y2="172" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1372,166 1386,172 1372,178" fill="#2563eb"/>
  <circle cx="1180" cy="172" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="1188" y="158" font-size="16" fill="#1d4ed8" class="math">U₁ = (1; 2)</text>
</g>
<g>
  <line x1="680" y1="217" x2="1372" y2="217" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1372,211 1386,217 1372,223" fill="#2563eb"/>
  <circle cx="680" cy="217" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="688" y="203" font-size="16" fill="#1d4ed8" class="math">U₂ = (1/2; 2)</text>
</g>
<g>
  <line x1="513" y1="262" x2="1372" y2="262" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1372,256 1386,262 1372,268" fill="#2563eb"/>
  <circle cx="513" cy="262" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="521" y="248" font-size="16" fill="#1d4ed8" class="math">U₃ = (1/3; 2)</text>
</g>
<g>
  <line x1="430" y1="307" x2="1372" y2="307" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1372,301 1386,307 1372,313" fill="#2563eb"/>
  <circle cx="430" cy="307" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="438" y="293" font-size="16" fill="#1d4ed8" class="math">U₄ = (1/4; 2)</text>
</g>
<g>
  <line x1="380" y1="352" x2="1372" y2="352" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1372,346 1386,352 1372,358" fill="#2563eb"/>
  <circle cx="380" cy="352" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="388" y="338" font-size="16" fill="#1d4ed8" class="math">U₅ = (1/5; 2)</text>
</g>
<g>
  <line x1="347" y1="397" x2="1372" y2="397" stroke="#2563eb" stroke-width="3"/>
  <polygon points="1372,391 1386,397 1372,403" fill="#2563eb"/>
  <circle cx="347" cy="397" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="355" y="383" font-size="16" fill="#1d4ed8" class="math">U₆ = (1/6; 2)</text>
</g>

<!-- объединение U1..U6 -->
<g>
  <line x1="347" y1="470" x2="1372" y2="470" stroke="#059669" stroke-width="4"/>
  <line x1="347" y1="462" x2="347" y2="478" stroke="#059669" stroke-width="4"/>
  <line x1="1372" y1="462" x2="1372" y2="478" stroke="#059669" stroke-width="4"/>
  <text x="500" y="456" font-size="17" fill="#047857" class="math">U₁ ∪ … ∪ U₆ = (1/6; 2)</text>
</g>

<!-- ось -->
<line x1="180" y1="520" x2="1380" y2="520" stroke="#94a3b8" stroke-width="4"/>
<g stroke="#94a3b8" stroke-width="2">
  <line x1="180" y1="512" x2="180" y2="528"/>
  <line x1="280" y1="512" x2="280" y2="528"/>
  <line x1="380" y1="512" x2="380" y2="528"/>
  <line x1="480" y1="512" x2="480" y2="528"/>
  <line x1="580" y1="512" x2="580" y2="528"/>
  <line x1="680" y1="512" x2="680" y2="528"/>
  <line x1="780" y1="512" x2="780" y2="528"/>
  <line x1="880" y1="512" x2="880" y2="528"/>
  <line x1="980" y1="512" x2="980" y2="528"/>
  <line x1="1080" y1="512" x2="1080" y2="528"/>
  <line x1="1180" y1="512" x2="1180" y2="528"/>
  <line x1="1280" y1="512" x2="1280" y2="528"/>
  <line x1="1380" y1="512" x2="1380" y2="528"/>
</g>
<g font-size="18" text-anchor="middle">
  <text x="180" y="556">0,0</text>
  <text x="380" y="556">0,2</text>
  <text x="580" y="556">0,4</text>
  <text x="780" y="556">0,6</text>
  <text x="980" y="556">0,8</text>
  <text x="1180" y="556">1,0</text>
  <text x="1380" y="556">1,2</text>
</g>

<!-- 0 не входит -->
<circle cx="180" cy="520" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="180" y="592" font-size="16" fill="#b91c1c" text-anchor="middle">0 ∉ (0,1]</text>

<!-- непокрытая точка 1/7 -->
<line x1="323" y1="520" x2="323" y2="470" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 6"/>
<circle cx="323" cy="520" r="6" fill="#dc2626"/>
<text x="323" y="604" font-size="17" fill="#b91c1c" text-anchor="middle">1/7</text>
<text x="323" y="628" font-size="15" fill="#b91c1c" text-anchor="middle">не покрыта</text>

<!-- пояснения -->
<text x="70" y="690" font-size="20">Для любого конечного набора номеров n₁, …, n_s: U(n₁) ∪ … ∪ U(n_s) = (1/N; 2), где N = max{n₁, …, n_s}.</text>
<text x="70" y="722" font-size="20">Точка 1/(N+1) лежит в (0,1], но не в (1/N; 2). Значит, конечного подпокрытия нет.</text>
<text x="70" y="754" font-size="17" class="muted">Причина: последовательность 1/n → 0 «убегает» к точке 0, которой нет в (0,1].</text>
</svg>
