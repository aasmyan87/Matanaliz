<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
  <title id="title">Теорема 1(c): единственность предела по доказательству Зорича</title>
  <desc id="desc">Показан ход доказательства Зорича: предположить разные пределы, выбрать непересекающиеся окрестности радиуса дельта меньше половины расстояния между ними, получить номера N1 и N2 из определения предела, взять максимум и вывести противоречие для общего хвоста.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40536b"/>
    </marker>
    <marker id="measure" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 4 L 8 0 L 8 8 z" fill="#1769aa"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #203047; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526477; }
      .head { font-size: 21px; font-weight: 700; }
      .label { font-size: 17px; }
      .small { font-size: 15px; fill: #526477; }
      .axis { stroke: #526477; stroke-width: 2.4; }
      .tick { stroke: #526477; stroke-width: 1.5; }
      .blueWindow { fill: #e9f3fb; stroke: #8ab6d8; stroke-width: 1.5; }
      .orangeWindow { fill: #fff2e5; stroke: #e5b47a; stroke-width: 1.5; }
      .panel { fill: #f7f9fc; stroke: #d5deea; stroke-width: 1.5; }
      .card { fill: #fff; stroke: #d5deea; stroke-width: 1.5; }
      .greenBox { fill: #eef7f3; stroke: #b8d7c8; stroke-width: 1.5; }
      .redBox { fill: #fff4f2; stroke: #e6c1bc; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1280" height="1080" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">Теорема 1(c): единственность предела — ход Зорича</text>
  <text x="640" y="78" text-anchor="middle" class="subtitle">Если xₙ→A₁ и xₙ→A₂, то A₁=A₂ · Зорич, т. 1, гл. III, § 1, с. 114–115</text>

  <rect x="42" y="106" width="1196" height="366" rx="16" class="panel"/>
  <text x="76" y="147" class="head">Шаг Зорича: вокруг разных точек выбираем непересекающиеся окрестности</text>
  <text x="76" y="176" class="small">Иллюстрация выбора: A₁=0, A₂=4, d=|A₁−A₂|=4; возьмём 0&lt;δ=1&lt;d/2=2.</text>

  <!-- Same-scale example: v maps to x=130+130(v+2), so A1=0, A2=4 and delta=1. -->
  <rect x="260" y="270" width="260" height="70" rx="8" class="blueWindow"/>
  <rect x="780" y="270" width="260" height="70" rx="8" class="orangeWindow"/>
  <line x1="130" y1="340" x2="1170" y2="340" class="axis"/>
  <line x1="390" y1="210" x2="390" y2="360" stroke="#1769aa" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="910" y1="210" x2="910" y2="360" stroke="#d87820" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="390" y="204" text-anchor="middle" class="label" font-weight="700" fill="#1769aa">A₁=0</text>
  <text x="910" y="204" text-anchor="middle" class="label" font-weight="700" fill="#b45c12">A₂=4</text>
  <line x1="390" y1="235" x2="910" y2="235" stroke="#40536b" stroke-width="2" marker-start="url(#measure)" marker-end="url(#measure)"/>
  <text x="650" y="224" text-anchor="middle" class="label">d=|A₁−A₂|=4</text>
  <line x1="390" y1="254" x2="520" y2="254" stroke="#1769aa" stroke-width="2" marker-start="url(#measure)" marker-end="url(#measure)"/>
  <text x="455" y="248" text-anchor="middle" class="small" fill="#1769aa">δ=1</text>
  <line x1="910" y1="254" x2="1040" y2="254" stroke="#d87820" stroke-width="2" marker-start="url(#measure)" marker-end="url(#measure)"/>
  <text x="975" y="248" text-anchor="middle" class="small" fill="#b45c12">δ=1</text>

  <g class="small" text-anchor="middle">
    <line x1="130" y1="332" x2="130" y2="348" class="tick"/><text x="130" y="370">−2</text>
    <line x1="260" y1="332" x2="260" y2="348" class="tick"/><text x="260" y="370">−1</text>
    <line x1="390" y1="332" x2="390" y2="348" class="tick"/><text x="390" y="370">0</text>
    <line x1="520" y1="332" x2="520" y2="348" class="tick"/><text x="520" y="370">1</text>
    <line x1="650" y1="332" x2="650" y2="348" class="tick"/><text x="650" y="370">2</text>
    <line x1="780" y1="332" x2="780" y2="348" class="tick"/><text x="780" y="370">3</text>
    <line x1="910" y1="332" x2="910" y2="348" class="tick"/><text x="910" y="370">4</text>
    <line x1="1040" y1="332" x2="1040" y2="348" class="tick"/><text x="1040" y="370">5</text>
    <line x1="1170" y1="332" x2="1170" y2="348" class="tick"/><text x="1170" y="370">6</text>
  </g>
  <circle cx="260" cy="340" r="9" fill="#fff" stroke="#1769aa" stroke-width="3"/>
  <circle cx="520" cy="340" r="9" fill="#fff" stroke="#1769aa" stroke-width="3"/>
  <circle cx="780" cy="340" r="9" fill="#fff" stroke="#d87820" stroke-width="3"/>
  <circle cx="1040" cy="340" r="9" fill="#fff" stroke="#d87820" stroke-width="3"/>
  <circle cx="390" cy="340" r="8" fill="#1769aa" stroke="#fff" stroke-width="2"/>
  <circle cx="910" cy="340" r="8" fill="#d87820" stroke="#fff" stroke-width="2"/>
  <text x="390" y="294" text-anchor="middle" class="small" fill="#1769aa">Vδ(A₁)=(−1,1)</text>
  <text x="910" y="294" text-anchor="middle" class="small" fill="#b45c12">Vδ(A₂)=(3,5)</text>
  <rect x="556" y="397" width="188" height="42" rx="10" fill="#fff" stroke="#cbd6e3" stroke-width="1.5"/>
  <text x="650" y="425" text-anchor="middle" class="label" font-weight="700">пересечение = ∅</text>
  <text x="640" y="458" text-anchor="middle" class="small">Именно такие два непересекающихся множества Зорич затем использует в доказательстве.</text>

  <rect x="42" y="498" width="1196" height="526" rx="16" fill="#fbfcfe" stroke="#d5deea" stroke-width="1.5"/>
  <text x="76" y="539" class="head">Доказательство по порядку, как у Зорича</text>

  <rect x="78" y="562" width="1122" height="88" rx="12" class="card"/>
  <circle cx="111" cy="594" r="17" fill="#40536b"/><text x="111" y="600" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
  <text x="143" y="595" class="label" font-weight="700">Предполагаем, что у одной последовательности два разных предела: A₁≠A₂.</text>
  <text x="143" y="628" class="label">Обозначаем расстояние d=|A₁−A₂| и выбираем δ-окрестности с 0&lt;δ&lt;d/2; они не пересекаются.</text>

  <rect x="78" y="667" width="1122" height="90" rx="12" class="card"/>
  <circle cx="111" cy="699" r="17" fill="#1769aa"/><text x="111" y="705" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
  <text x="143" y="700" class="label" font-weight="700">Из xₙ→A₁ по определению предела найдётся N₁:</text>
  <text x="143" y="734" class="label">для всех n&gt;N₁ выполнено xₙ∈Vδ(A₁).</text>

  <rect x="78" y="774" width="1122" height="90" rx="12" class="card"/>
  <circle cx="111" cy="806" r="17" fill="#d87820"/><text x="111" y="812" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
  <text x="143" y="807" class="label" font-weight="700">Из xₙ→A₂ по определению предела найдётся N₂:</text>
  <text x="143" y="841" class="label">для всех n&gt;N₂ выполнено xₙ∈Vδ(A₂).</text>

  <rect x="112" y="880" width="1056" height="72" rx="12" fill="#f1f5fa" stroke="#cbd6e3" stroke-width="1.5"/>
  <circle cx="145" cy="916" r="17" fill="#40536b"/><text x="145" y="922" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">4</text>
  <text x="640" y="909" text-anchor="middle" class="label" font-weight="700">Берём N=max{N₁,N₂}. Если n&gt;N, то одновременно n&gt;N₁ и n&gt;N₂.</text>
  <text x="640" y="937" text-anchor="middle" class="small">Поэтому один и тот же член xₙ должен принадлежать обеим окрестностям.</text>

  <rect x="180" y="967" width="920" height="42" rx="11" class="redBox"/>
  <text x="640" y="995" text-anchor="middle" class="label" font-weight="700">xₙ∈Vδ(A₁)∩Vδ(A₂)=∅ — невозможно. Значит, A₁=A₂.</text>
  <text x="640" y="1050" text-anchor="middle" class="small">Зорич, т. 1, гл. III, § 1, теорема 1(c), с. 114–115. Числа на прямой только иллюстрируют выбор δ.</text>
</svg>
