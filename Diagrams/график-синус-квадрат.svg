<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">График функции y = sin²(x)</title>
  <desc id="desc">График на отрезке от минус двух пи до двух пи. На оси x отмечены деления через пи пополам, на оси y — значения ноль, одна вторая и один.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26364a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #26364a; }
      .grid { stroke: #dce4ee; stroke-width: 1; }
      .axis { stroke: #26364a; stroke-width: 2.4; }
      .tick { stroke: #26364a; stroke-width: 1.8; }
      .curve { fill: none; stroke: #1769aa; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .zero { fill: #1769aa; stroke: white; stroke-width: 2; }
      .peak { fill: #e07a24; stroke: white; stroke-width: 2; }
      .label { font-size: 18px; }
      .small { font-size: 16px; }
    </style>
  </defs>

  <rect width="1240" height="620" fill="#ffffff"/>
  <text x="640" y="43" text-anchor="middle" font-size="28" font-weight="600">График функции y = sin²(x)</text>
  <text x="640" y="70" text-anchor="middle" font-size="16" fill="#526477">Показан отрезок [−2π; 2π]; масштаб по x одинаковый</text>

  <!-- Plot area: x = 160…1120, y = 140…440. -->
  <line class="grid" x1="160" y1="140" x2="1120" y2="140"/>
  <line class="grid" x1="160" y1="290" x2="1120" y2="290"/>
  <line class="grid" x1="160" y1="440" x2="1120" y2="440"/>

  <!-- Vertical grid lines at multiples of π/2. -->
  <g class="grid">
    <line x1="160" y1="140" x2="160" y2="440"/>
    <line x1="280" y1="140" x2="280" y2="440"/>
    <line x1="400" y1="140" x2="400" y2="440"/>
    <line x1="520" y1="140" x2="520" y2="440"/>
    <line x1="640" y1="140" x2="640" y2="440"/>
    <line x1="760" y1="140" x2="760" y2="440"/>
    <line x1="880" y1="140" x2="880" y2="440"/>
    <line x1="1000" y1="140" x2="1000" y2="440"/>
    <line x1="1120" y1="140" x2="1120" y2="440"/>
  </g>

  <!-- Axes. -->
  <line class="axis" x1="130" y1="440" x2="1150" y2="440" marker-end="url(#arrow)"/>
  <line class="axis" x1="640" y1="470" x2="640" y2="103" marker-end="url(#arrow)"/>
  <text x="1166" y="447" font-size="20" font-style="italic">x</text>
  <text x="650" y="101" font-size="20" font-style="italic">y</text>

  <!-- y-axis values. -->
  <g class="tick">
    <line x1="633" y1="440" x2="647" y2="440"/>
    <line x1="633" y1="290" x2="647" y2="290"/>
    <line x1="633" y1="140" x2="647" y2="140"/>
  </g>
  <text class="label" x="617" y="446" text-anchor="end">0</text>
  <text class="label" x="617" y="296" text-anchor="end">1/2</text>
  <text class="label" x="617" y="146" text-anchor="end">1</text>

  <!-- x-axis values at multiples of π/2. -->
  <g class="tick">
    <line x1="160" y1="433" x2="160" y2="447"/>
    <line x1="280" y1="433" x2="280" y2="447"/>
    <line x1="400" y1="433" x2="400" y2="447"/>
    <line x1="520" y1="433" x2="520" y2="447"/>
    <line x1="640" y1="433" x2="640" y2="447"/>
    <line x1="760" y1="433" x2="760" y2="447"/>
    <line x1="880" y1="433" x2="880" y2="447"/>
    <line x1="1000" y1="433" x2="1000" y2="447"/>
    <line x1="1120" y1="433" x2="1120" y2="447"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="160" y="478">−2π</text>
    <text x="280" y="478">−3π/2</text>
    <text x="400" y="478">−π</text>
    <text x="520" y="478">−π/2</text>
    <text x="640" y="478">0</text>
    <text x="760" y="478">π/2</text>
    <text x="880" y="478">π</text>
    <text x="1000" y="478">3π/2</text>
    <text x="1120" y="478">2π</text>
  </g>

