  <!-- Characteristic points: zeros and maxima. -->
  <g>
    <circle class="zero" cx="160" cy="440" r="6"/>
    <circle class="peak" cx="280" cy="140" r="7"/>
    <circle class="zero" cx="400" cy="440" r="6"/>
    <circle class="peak" cx="520" cy="140" r="7"/>
    <circle class="zero" cx="640" cy="440" r="6"/>
    <circle class="peak" cx="760" cy="140" r="7"/>
    <circle class="zero" cx="880" cy="440" r="6"/>
    <circle class="peak" cx="1000" cy="140" r="7"/>
    <circle class="zero" cx="1120" cy="440" r="6"/>
  </g>

  <text class="small" x="160" y="540" fill="#1769aa">Нули: x = kπ, y = 0</text>
  <text class="small" x="640" y="540" fill="#b85b13">Максимумы: x = π/2 + kπ, y = 1</text>
  <text x="640" y="585" text-anchor="middle" font-size="14" fill="#526477">Схема показывает период π и значения в отмеченных точках; она не заменяет аналитическое исследование функции.</text>
</svg>
