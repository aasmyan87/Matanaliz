<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1580" viewBox="0 0 1800 1580" role="img" aria-labelledby="title desc">
<title id="title">Зачем в доказательстве плотности рациональных чисел выбирают шаг меньше b−a</title>
<desc id="desc">Сверху формула объясняет, что b−a — доступная ширина интервала, а первая отметка сетки после a отстоит не более чем на 1/n. На точном примере (1,4; 1,55) показана сетка 1/8, где 1,5 попадает внутрь, и более крупная сетка 1/5, где первая отметка после 1,4 равна 1,6 и пропускает интервал.</desc>
<defs>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}
    .math{font-family:Cambria,'Times New Roman',serif}
    .muted{fill:#5b6678}
    .green{fill:#047857}
    .orange{fill:#c2410c}
    .red{fill:#b91c1c}
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#334155"/></marker>
</defs>
<rect width="1800" height="1580" fill="#eef3f9"/>
<rect x="24" y="24" width="1752" height="1532" rx="30" fill="#fff" stroke="#d7e0eb" stroke-width="3"/>

<text x="72" y="92" font-size="48" font-weight="700">Зачем в доказательстве появляется b − a?</text>
<text x="74" y="140" font-size="27" class="muted">Следствие 9° Зорича: найти рациональное r строго между a и b</text>

<rect x="66" y="176" width="1668" height="250" rx="22" fill="#f8fafc" stroke="#d9e2ed" stroke-width="3"/>
<text x="104" y="226" font-size="30" font-weight="700">b − a — это ширина промежутка, в который нужно попасть</text>
<text x="104" y="276" font-size="28" class="math">1. Следствие 7°: выбираем n так, чтобы 0 &lt; 1/n &lt; b − a.</text>
<text x="104" y="326" font-size="28" class="math">2. Принцип 6° при h = 1/n, x = a даёт (m − 1)/n ≤ a &lt; m/n; берём r = m/n.</text>
<rect x="100" y="352" width="1588" height="54" rx="12" fill="#ecfdf5"/>
<text x="124" y="390" font-size="30" class="math" font-weight="700" fill="#166534">Тогда  0 &lt; r − a ≤ 1/n &lt; b − a,  значит  a &lt; r &lt; b.</text>

<text x="74" y="494" font-size="34" font-weight="700">Подходящая сетка: a = 1,4, b = 1,55, шаг 1/n = 1/8 = 0,125</text>
<text x="74" y="536" font-size="25" class="muted">Зазор b − a = 0,15. Ячейка Архимеда [11/8; 12/8) содержит a; её правый конец r = 12/8 = 1,5 попадает внутрь (a,b).</text>

<!-- target interval, first grid -->
<rect x="850" y="592" width="450" height="72" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
<text x="1075" y="621" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">искомый интервал (a,b)</text>
<text x="1075" y="650" text-anchor="middle" font-size="22" fill="#9a3412">ширина b − a = 0,15</text>
<rect x="775" y="704" width="375" height="58" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6"/>
<text x="962" y="741" text-anchor="middle" font-size="22" font-weight="700" fill="#1e40af">ячейка [11/8; 12/8) = [1,375; 1,5)</text>

<line x1="300" y1="800" x2="1625" y2="800" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<!-- exact coordinate map x = 850 + 3000*(value - 1.4) -->
<rect x="850" y="778" width="450" height="44" fill="#fdba74" opacity="0.34"/>
<g stroke="#64748b" stroke-width="3">
  <path d="M775 779v42M850 779v42M1150 779v42M1300 779v42M1525 779v42"/>
</g>
<g font-size="24" text-anchor="middle" class="muted">
  <text x="775" y="866">1,375</text>
  <text x="850" y="912" font-weight="700" fill="#c2410c">a = 1,4</text>
  <text x="1150" y="866" font-weight="700" fill="#047857">r = 1,5</text>
  <text x="1300" y="912" font-weight="700" fill="#c2410c">b = 1,55</text>
  <text x="1525" y="866">1,625</text>
</g>
<line x1="850" y1="760" x2="850" y2="825" stroke="#c2410c" stroke-width="4" stroke-dasharray="8 6"/>
<line x1="1300" y1="760" x2="1300" y2="825" stroke="#c2410c" stroke-width="4" stroke-dasharray="8 6"/>
<circle cx="850" cy="800" r="10" fill="#fff" stroke="#c2410c" stroke-width="4"/>
<circle cx="1150" cy="800" r="12" fill="#059669" stroke="#fff" stroke-width="4"/>
<circle cx="1300" cy="800" r="10" fill="#fff" stroke="#c2410c" stroke-width="4"/>
<circle cx="1525" cy="800" r="9" fill="#64748b"/>

<!-- lengths: r-a, mesh step, full available gap -->
<line x1="850" y1="962" x2="1150" y2="962" stroke="#047857" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1000" y="950" text-anchor="middle" font-size="23" font-weight="700" class="green">r − a = 0,10</text>
<line x1="775" y1="1022" x2="1150" y2="1022" stroke="#2563eb" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="962" y="1058" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">1/n = 1/8 = 0,125</text>
<line x1="850" y1="1100" x2="1300" y2="1100" stroke="#c2410c" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1075" y="1138" text-anchor="middle" font-size="23" font-weight="700" class="orange">b − a = 0,15</text>
<text x="74" y="1194" font-size="28" class="math" font-weight="700">0,10 = r − a ≤ 0,125 = 1/8 &lt; 0,15 = b − a</text>

<line x1="74" y1="1230" x2="1725" y2="1230" stroke="#d8e0ea" stroke-width="2"/>
<text x="74" y="1284" font-size="32" font-weight="700">Если шаг больше зазора, первая отметка может перескочить через b</text>
<text x="74" y="1324" font-size="24" class="muted">Та же пара a = 1,4 и b = 1,55, но сетка с шагом 1/5 = 0,2: отметка 1,4 совпадает с a, следующая — 1,6 &gt; b.</text>

<!-- coarse grid on same numerical scale -->
<rect x="850" y="1360" width="450" height="42" rx="8" fill="#ffedd5" opacity="0.7"/>
<line x1="300" y1="1382" x2="1625" y2="1382" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
<g stroke="#64748b" stroke-width="3">
  <path d="M850 1364v36M1300 1364v36M1450 1364v36"/>
</g>
<circle cx="850" cy="1382" r="10" fill="#fff" stroke="#c2410c" stroke-width="4"/>
<circle cx="1300" cy="1382" r="10" fill="#fff" stroke="#c2410c" stroke-width="4"/>
<circle cx="1450" cy="1382" r="12" fill="#dc2626" stroke="#fff" stroke-width="4"/>
<text x="850" y="1440" text-anchor="middle" font-size="24" font-weight="700" class="orange">a = 1,4</text>
<text x="1300" y="1480" text-anchor="middle" font-size="24" font-weight="700" class="orange">b = 1,55</text>
<text x="1450" y="1440" text-anchor="middle" font-size="24" font-weight="700" class="red">1,6 (уже за b)</text>
<text x="74" y="1520" font-size="25" class="muted">Мелкий шаг гарантирует попадание; крупный шаг может сработать в отдельных случаях, но такой гарантии не даёт.</text>
</svg>
