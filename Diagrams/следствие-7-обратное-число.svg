<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">Следствие 7°, чертёж 2: обратное число 1/n меньше ε</title>
<desc id="desc">После получения 1&lt;nε делим на n&gt;0 и получаем 1/n&lt;ε. На масштабированной числовой прямой для n=3 и ε=0,4 точка 1/3≈0,333 лежит строго между нулём и ε=0,4.</desc>
<defs>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}
    .math{font-family:Cambria,'Times New Roman',serif}
    .muted{fill:#5b6678}
  </style>
  <marker id="axis" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#334155"/></marker>
  <marker id="green" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse"><path d="M0 0L12 6L0 12z" fill="#059669"/></marker>
</defs>
<rect width="1800" height="1000" fill="#eef3f9"/>
<rect x="24" y="24" width="1752" height="952" rx="30" fill="#fff" stroke="#d7e0eb" stroke-width="3"/>
<text x="72" y="92" font-size="47" font-weight="700">2. Из nε &gt; 1 получаем 1/n &lt; ε</text>
<text x="74" y="140" font-size="27" class="muted">Здесь n — натуральное число из первого чертежа, поэтому деление на n сохраняет знак неравенства</text>

<rect x="68" y="176" width="1664" height="190" rx="22" fill="#f5f3ff" stroke="#d8ccfa" stroke-width="3"/>
<text x="108" y="230" font-size="29" font-weight="700" fill="#5b21b6">Переход к обратному числу</text>
<text x="108" y="288" font-size="38" class="math">1 &lt; nε</text>
<text x="390" y="288" font-size="32" class="math">делим обе части на n &gt; 0</text>
<text x="1010" y="288" font-size="40" class="math" font-weight="700" fill="#047857">⇒  1/n &lt; ε</text>
<text x="108" y="338" font-size="26" class="math">Кроме того, n &gt; 0 даёт 1/n &gt; 0; вместе: 0 &lt; 1/n &lt; ε.</text>

<text x="76" y="442" font-size="32" font-weight="700">Пример: n = 3, ε = 0,4</text>
<text x="78" y="480" font-size="24" class="muted">Масштаб оси: 1 единица = 2000 px. Точка 1/3 находится левее ε.</text>

<!-- 0 to epsilon region -->
<rect x="260" y="554" width="800" height="78" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
<text x="660" y="602" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">отрезок от 0 до ε = 0,4</text>
<line x1="220" y1="594" x2="1510" y2="594" stroke="#334155" stroke-width="5" marker-end="url(#axis)"/>
<!-- mapping: x = 260 + 2000*x -->
<g stroke="#64748b" stroke-width="3">
  <path d="M260 572v44M926.67 572v44M1060 572v44M1260 572v44"/>
</g>
<line x1="926.67" y1="524" x2="926.67" y2="622" stroke="#059669" stroke-width="4" stroke-dasharray="9 7"/>
<circle cx="926.67" cy="594" r="12" fill="#059669" stroke="#fff" stroke-width="4"/>
<circle cx="1060" cy="594" r="11" fill="#fff" stroke="#b45309" stroke-width="4"/>
<g font-size="26" text-anchor="middle" class="muted">
  <text x="260" y="680">0</text>
  <text x="926.67" y="680" font-weight="700" fill="#047857">1/n = 1/3 ≈ 0,333</text>
  <text x="1060" y="730" font-weight="700" fill="#92400e">ε = 0,4</text>
  <text x="1260" y="680">1/2</text>
</g>
<line x1="926.67" y1="510" x2="1060" y2="510" stroke="#059669" stroke-width="4" marker-start="url(#green)" marker-end="url(#green)"/>
<text x="993" y="496" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">запас ε − 1/n ≈ 0,067</text>

<rect x="68" y="792" width="1664" height="112" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="3"/>
<text x="106" y="844" font-size="30" class="math" font-weight="700">Из первого чертежа: 1 &lt; 3·0,4 = 1,2.</text>
<text x="106" y="884" font-size="29" class="math">Делим на 3: 1/3 ≈ 0,333 &lt; 0,4 = ε; также 0 &lt; 1/3.</text>
</svg>
