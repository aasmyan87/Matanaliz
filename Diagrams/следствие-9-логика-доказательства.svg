<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1200" viewBox="0 0 1560 1200" role="img" aria-labelledby="title desc">
<title id="title">Следствие 9°: плотность рациональных чисел — почему первая отметка сетки справа от a попадает в интервал (a, b)</title>
<desc id="desc">Числовой пример a = 1,4, b = 2,1, n = 2, m = 3: сетка с шагом 1/2, точка a внутри клетки от 1 до 1,5, точка r = 3/2 на правом конце этой клетки, отрезок длины 1/n, отложенный от a, и промежуток b − a; под рисунком цепочка неравенств a &lt; r ≤ a + 1/n &lt; b.</desc>
<defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}
.math{font-family:Cambria,'Times New Roman',serif}
.muted{fill:#64748b}
.blue{fill:#1d4ed8}
.orange{fill:#c2410c}
.green{fill:#047857}
.onDark{fill:#ffffff}
</style>
</defs>

<rect width="1560" height="1200" fill="#f3f6fb"/>
<rect x="24" y="20" width="1512" height="1160" rx="28" fill="#ffffff" stroke="#dbe3ef" stroke-width="2"/>

<text x="72" y="84" font-size="40" font-weight="700">Следствие 9°: плотность рациональных чисел</text>
<text x="72" y="126" font-size="23" class="muted">Идея: шаг сетки меньше промежутка, поэтому первая отметка справа от a ещё не достигает b</text>

<rect x="60" y="148" width="1440" height="114" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="92" y="186" font-size="22" font-weight="700" class="blue">Утверждение (Зорич, т. 1, гл. II, § 2, п. 3)</text>
<text x="92" y="234" font-size="29" class="math">Для любых a, b ∈ ℝ, a &lt; b, существует r ∈ ℚ: a &lt; r &lt; b.</text>

<rect x="60" y="286" width="460" height="152" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<circle cx="106" cy="328" r="22" fill="#ea580c"/>
<text x="106" y="337" text-anchor="middle" font-size="24" font-weight="700" class="onDark">1</text>
<text x="144" y="336" font-size="25" font-weight="700">Выбираем мелкий шаг</text>
<text x="92" y="390" font-size="27" class="math">1/n &lt; b − a</text>
<text x="92" y="420" font-size="20" class="muted">следствие 7° при ε = b − a</text>

<rect x="550" y="286" width="460" height="152" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<circle cx="596" cy="328" r="22" fill="#2563eb"/>
<text x="596" y="337" text-anchor="middle" font-size="24" font-weight="700" class="onDark">2</text>
<text x="634" y="336" font-size="25" font-weight="700">Первая отметка справа</text>
<text x="582" y="390" font-size="27" class="math">(m−1)/n ≤ a &lt; m/n</text>
<text x="582" y="420" font-size="20" class="muted">m — наименьшее целое с m/n &gt; a</text>

<rect x="1040" y="286" width="460" height="152" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<circle cx="1086" cy="328" r="22" fill="#059669"/>
<text x="1086" y="337" text-anchor="middle" font-size="24" font-weight="700" class="onDark">3</text>
<text x="1124" y="336" font-size="25" font-weight="700">Оценка расстояния</text>
<text x="1072" y="390" font-size="27" class="math">a &lt; m/n ≤ a + 1/n &lt; b</text>
<text x="1072" y="420" font-size="20" class="muted">последний переход — из шага 1</text>

<text x="72" y="500" font-size="24">Рисунок для примера: <tspan class="math">a = 1,4;  b = 2,1;  n = 2;  1/n = 0,5;  m = 3;  r = m/n = 1,5</tspan></text>

<!-- отрезок длины 1/n, отложенный от a -->
<line x1="656" y1="636" x2="826" y2="636" stroke="#2563eb" stroke-width="3"/>
<line x1="656" y1="636" x2="656" y2="698" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 7"/>
<line x1="826" y1="636" x2="826" y2="698" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 7"/>
<text x="741" y="572" text-anchor="middle" font-size="20" class="muted">отрезок длины 1/n, отложенный от a</text>
<text x="741" y="604" text-anchor="middle" font-size="23" font-weight="700" class="blue">его конец a + 1/n = 1,9 левее b = 2,1</text>

<!-- числовая прямая -->
<line x1="656" y1="700" x2="894" y2="700" stroke="#fdba74" stroke-width="16" opacity="0.6" stroke-linecap="round"/>
<line x1="150" y1="700" x2="1330" y2="700" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
<g stroke="#94a3b8" stroke-width="2.5">
<line x1="180" y1="690" x2="180" y2="710"/>
<line x1="350" y1="690" x2="350" y2="710"/>
<line x1="520" y1="690" x2="520" y2="710"/>
<line x1="690" y1="690" x2="690" y2="710"/>
<line x1="860" y1="690" x2="860" y2="710"/>
<line x1="1030" y1="690" x2="1030" y2="710"/>
<line x1="1200" y1="690" x2="1200" y2="710"/>
</g>
<g font-size="21" class="muted" text-anchor="middle">
<text x="180" y="744">0</text>
<text x="350" y="744">1/2</text>
<text x="520" y="744">1</text>
<text x="690" y="744">3/2</text>
<text x="860" y="744">2</text>
<text x="1030" y="744">5/2</text>
<text x="1200" y="744">3</text>
</g>
<text x="775" y="742" text-anchor="middle" font-size="20" font-weight="700" class="orange">(a, b)</text>

<!-- точки -->
<circle cx="656" cy="700" r="8" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
<circle cx="894" cy="700" r="8" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
<circle cx="690" cy="700" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>

<text x="640" y="686" text-anchor="end" font-size="24" font-weight="700" class="orange">a = 1,4</text>
<text x="702" y="686" font-size="24" font-weight="700" class="blue">r = 3/2</text>
<text x="908" y="686" font-size="24" font-weight="700" class="orange">b = 2,1</text>

<!-- промежуток b − a -->
<line x1="656" y1="714" x2="656" y2="790" stroke="#c2410c" stroke-width="2.5"/>
<line x1="894" y1="714" x2="894" y2="790" stroke="#c2410c" stroke-width="2.5"/>
<line x1="656" y1="790" x2="894" y2="790" stroke="#c2410c" stroke-width="3"/>
<text x="775" y="826" text-anchor="middle" font-size="23" font-weight="700" class="orange">b − a = 0,7 &gt; 0,5 = 1/n</text>

<!-- цепочка неравенств -->
<rect x="60" y="890" width="1440" height="116" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="780" y="940" text-anchor="middle" font-size="32" class="math">a &lt; <tspan class="blue" font-weight="700">r</tspan> ≤ <tspan class="blue" font-weight="700">a + 1/n</tspan> &lt; <tspan class="orange" font-weight="700">a + (b − a) = b</tspan></text>
<text x="780" y="980" text-anchor="middle" font-size="20" class="muted">слева направо: выбор m (шаг 2), затем выбор n (шаг 1)</text>

<rect x="60" y="1014" width="1440" height="82" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<text x="92" y="1064" font-size="25" class="math"><tspan class="green" font-weight="700">Вывод.</tspan>  r = m/n ∈ ℚ, и a &lt; r &lt; b — рациональное число между a и b найдено.</text>

<text x="72" y="1136" font-size="19" class="muted">Чертёж иллюстрирует один пример; в доказательстве те же три шага повторяются для произвольных a &lt; b.</text>
</svg>
