<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Лемма Бореля – Лебега: вложенные «плохие» отрезки и интервал U, содержащий предельную точку c</title>
<desc id="desc">Числовой пример: c = 2/3, U = (0,6; 0,8). Вложенные отрезки I1 ⊃ I2 ⊃ … ⊃ I5 сходятся к c. Длина I5 равна 1/16, что меньше ε = 1/15, поэтому I5 целиком лежит в U.</desc>
<defs>
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.math { font-family: Cambria, 'Times New Roman', serif; }
.muted { fill: #64748b; }
</style>
</defs>

<rect width="1600" height="900" fill="#f4f7fb"/>
<rect x="30" y="25" width="1540" height="850" rx="24" fill="#ffffff" stroke="#dbe3ef" stroke-width="2"/>

<text x="70" y="72" font-size="34" font-weight="700">Почему работает деление пополам: плохой отрезок попадает внутрь U</text>
<text x="70" y="108" font-size="19" class="muted">Зорич, т. 1, § 3, п. 2, с. 101–103. Числовой пример: c = 2/3, U = (0,6; 0,8)</text>

<!-- вертикальные границы U -->
<g stroke="#059669" stroke-width="2" stroke-dasharray="5 7" opacity="0.8">
  <line x1="920" y1="470" x2="920" y2="640"/>
  <line x1="1160" y1="470" x2="1160" y2="640"/>
</g>

<!-- предельная точка c -->
<line x1="1000" y1="140" x2="1000" y2="630" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7"/>
<circle cx="1000" cy="140" r="6" fill="#dc2626"/>
<text x="1012" y="134" font-size="20" fill="#b91c1c" class="math">c = 2/3</text>

<!-- вложенные отрезки -->
<g>
  <rect x="200" y="170" width="1200" height="24" rx="4" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1412" y="188" font-size="17" fill="#1d4ed8" class="math">I₁ = [0; 1]</text>
</g>
<g>
  <rect x="800" y="225" width="600" height="24" rx="4" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1412" y="243" font-size="17" fill="#1d4ed8" class="math">I₂ = [0,5; 1]</text>
</g>
<g>
  <rect x="800" y="280" width="300" height="24" rx="4" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1112" y="298" font-size="17" fill="#1d4ed8" class="math">I₃ = [0,5; 0,75]</text>
</g>
<g>
  <rect x="950" y="335" width="150" height="24" rx="4" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1112" y="353" font-size="17" fill="#1d4ed8" class="math">I₄ = [0,625; 0,75]</text>
</g>
<g>
  <rect x="950" y="390" width="75" height="24" rx="4" fill="#f59e0b" fill-opacity="0.25" stroke="#b45309" stroke-width="3"/>
  <text x="1037" y="408" font-size="17" fill="#92400e" class="math">I₅ = [0,625; 0,6875]</text>
</g>

<!-- интервал U -->
<g>
  <rect x="920" y="500" width="240" height="34" rx="5" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="3"/>
  <circle cx="920" cy="517" r="6" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <circle cx="1160" cy="517" r="6" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="908" y="492" font-size="19" fill="#047857" class="math" text-anchor="end">U = (0,6; 0,8)</text>
</g>

<!-- длина I5 -->
<g stroke="#b45309" stroke-width="2">
  <line x1="950" y1="438" x2="950" y2="448"/>
  <line x1="1025" y1="438" x2="1025" y2="448"/>
  <line x1="950" y1="443" x2="1025" y2="443"/>
</g>
<text x="1037" y="447" font-size="16" fill="#92400e">|I₅| = 1/16 = 0,0625</text>

<!-- эпсилон -->
<g stroke="#059669" stroke-width="2">
  <line x1="920" y1="590" x2="1000" y2="590"/>
  <polygon points="920,590 933,584 933,596" fill="#059669"/>
  <polygon points="1000,590 987,584 987,596" fill="#059669"/>
</g>
<text x="985" y="620" font-size="16" fill="#047857" text-anchor="end">ε = c − 0,6 = 1/15 ≈ 0,0667</text>

<!-- ось -->
<line x1="200" y1="640" x2="1400" y2="640" stroke="#94a3b8" stroke-width="4"/>
<g stroke="#94a3b8" stroke-width="2">
  <line x1="200" y1="632" x2="200" y2="648"/>
  <line x1="320" y1="632" x2="320" y2="648"/>
  <line x1="440" y1="632" x2="440" y2="648"/>
  <line x1="560" y1="632" x2="560" y2="648"/>
  <line x1="680" y1="632" x2="680" y2="648"/>
  <line x1="800" y1="632" x2="800" y2="648"/>
  <line x1="920" y1="632" x2="920" y2="648"/>
  <line x1="1040" y1="632" x2="1040" y2="648"/>
  <line x1="1160" y1="632" x2="1160" y2="648"/>
  <line x1="1280" y1="632" x2="1280" y2="648"/>
  <line x1="1400" y1="632" x2="1400" y2="648"/>
</g>
<g font-size="18" text-anchor="middle">
  <text x="200" y="676">0,0</text>
  <text x="440" y="676">0,2</text>
  <text x="680" y="676">0,4</text>
  <text x="920" y="676">0,6</text>
  <text x="1160" y="676">0,8</text>
  <text x="1400" y="676">1,0</text>
</g>
<g font-size="16" fill="#b91c1c" text-anchor="middle">
  <text x="1000" y="676">2/3</text>
</g>

<!-- пояснения -->
<text x="70" y="742" font-size="20">I₅ = [0,625; 0,6875] ⊂ U = (0,6; 0,8): одного интервала U уже достаточно, чтобы покрыть I₅.</text>
<text x="70" y="778" font-size="20">Но I₅ строился как отрезок, который нельзя покрыть конечным набором интервалов из S, — противоречие.</text>
<text x="70" y="816" font-size="18" class="muted">Ключ: c лежит внутри U, поэтому ε = min{c − 0,6; 0,8 − c} = 1/15 &gt; 0; а длина I_n стремится к нулю.</text>
<text x="70" y="850" font-size="18" class="muted">Как только |I_n| &lt; ε, весь I_n оказывается внутри U: для x ∈ I_n имеем |x − c| ≤ |I_n| &lt; ε.</text>
</svg>
