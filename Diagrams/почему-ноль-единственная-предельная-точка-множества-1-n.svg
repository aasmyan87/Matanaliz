<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Почему 0 — единственная предельная точка множества 1/n</title>
  <desc id="desc">Слева показано, что любая окрестность нуля содержит все 1/n при достаточно больших n, поэтому в ней бесконечно много точек множества. Справа для q=1/4 показана окрестность радиуса q/2, содержащая лишь конечное число обратных натуральных чисел. Для общего q не равного нулю аналогично выбирается радиус |q|/2.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 19px; }
      .axis { stroke: #334155; stroke-width: 2; }
      .tick { stroke: #334155; stroke-width: 1.5; }
      .dot { fill: #2563eb; stroke: white; stroke-width: 1.5; }
      .red { fill: #dc2626; }
    </style>
  </defs>
  <rect width="1400" height="930" fill="#f8fafc"/>
  <text x="60" y="55" class="title">Почему 0 — единственная предельная точка множества X = {1/n : n ∈ ℕ}</text>
  <text x="60" y="86" class="subtitle">По определению, каждая окрестность предельной точки должна содержать бесконечно много элементов X.</text>

  <rect x="55" y="112" width="635" height="654" rx="16" fill="white" stroke="#cbd5e1"/>
  <text x="82" y="153" class="head">1. Точка p = 0 действительно предельная</text>
  <text x="82" y="188" class="body">Берём произвольную δ &gt; 0:</text>
  <text x="82" y="220" class="math">Uδ(0) = (−δ, δ).</text>
  <text x="82" y="253" class="body">Например, при δ = 1/5:</text>
  <text x="82" y="283" class="math">U₁/₅(0) = (−1/5, 1/5).</text>
  <text x="82" y="316" class="body">Для любого n ≥ 6: 0 &lt; 1/n ≤ 1/6 &lt; 1/5.</text>

  <!-- Scale: x=185 corresponds to -0.25; x=605 to 0.45 (600 px/unit); p=0 is x=335. -->
  <line x1="185" y1="390" x2="605" y2="390" class="axis"/>
  <rect x="215" y="369" width="240" height="42" rx="8" fill="#fee2e2" stroke="#f87171" stroke-dasharray="5 4"/>
  <line x1="215" y1="350" x2="215" y2="428" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="455" y1="350" x2="455" y2="428" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="335" y1="350" x2="335" y2="430" stroke="#dc2626" stroke-width="2.5"/>
  <g class="tick"><path d="M185 382v16 M215 382v16 M335 382v16 M455 382v16 M485 382v16 M605 382v16"/></g>
  <g class="small" text-anchor="middle"><text x="185" y="452">−0,25</text><text x="215" y="452">−1/5</text><text x="335" y="452">0</text><text x="455" y="452">1/5</text><text x="485" y="452">1/4</text><text x="535" y="452">1/3</text><text x="605" y="452">0,45</text></g>
  <g class="dot">
    <circle cx="535" cy="390" r="7"/><circle cx="485" cy="390" r="7"/><circle cx="455" cy="390" r="7"/><circle cx="435" cy="390" r="7"/><circle cx="421" cy="390" r="7"/><circle cx="410" cy="390" r="7"/><circle cx="402" cy="390" r="7"/><circle cx="395" cy="390" r="7"/><circle cx="389" cy="390" r="7"/><circle cx="385" cy="390" r="7"/>
  </g>
  <text x="335" y="344" class="small" text-anchor="middle" fill="#b91c1c">p = 0</text>
  <text x="335" y="477" class="small" text-anchor="middle">красная полоса — выбранная окрестность</text>
  <text x="82" y="524" class="body">В ней лежат все 1/6, 1/7, 1/8, … — бесконечно много точек X.</text>
  <rect x="82" y="553" width="580" height="88" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="103" y="587" class="math">Для общей δ &gt; 0 выберем N &gt; 1/δ.</text>
  <text x="103" y="618" class="body">Тогда при всех n ≥ N имеем 0 &lt; 1/n &lt; δ.</text>
  <text x="82" y="680" class="body" font-weight="700" fill="#1d4ed8">Значит, подходит любая δ-окрестность нуля.</text>

  <rect x="710" y="112" width="635" height="654" rx="16" fill="white" stroke="#cbd5e1"/>
  <text x="737" y="153" class="head">2. Ни одна точка q ≠ 0 не предельная</text>
  <text x="737" y="188" class="body">Покажем на q = 1/4 ∈ X и возьмём δ = q/2 = 1/8:</text>
  <text x="737" y="220" class="math">Uδ(q) = (q/2, 3q/2) = (1/8, 3/8).</text>
  <text x="737" y="253" class="body">В этой окрестности находятся только 1/3, 1/4, 1/5, 1/6, 1/7.</text>

  <!-- Scale: x=770 is 0; 1230 is 0.5 (920 px/unit). -->
  <line x1="770" y1="390" x2="1230" y2="390" class="axis"/>
  <rect x="885" y="369" width="230" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-dasharray="5 4"/>
  <line x1="885" y1="350" x2="885" y2="428" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="1115" y1="350" x2="1115" y2="428" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <g class="tick"><path d="M770 382v16 M885 382v16 M1000 382v16 M1115 382v16 M1230 382v16"/></g>
  <g class="small" text-anchor="middle"><text x="770" y="452">0</text><text x="885" y="452">1/8</text><text x="1000" y="452">1/4</text><text x="1115" y="452">3/8</text><text x="1230" y="452">1/2</text></g>
  <g class="dot">
    <circle cx="1076.7" cy="390" r="7"/><circle cx="1000" cy="390" r="7"/><circle cx="954" cy="390" r="7"/><circle cx="923.3" cy="390" r="7"/><circle cx="901.4" cy="390" r="7"/>
    <circle cx="885" cy="390" r="6" fill="#94a3b8"/>
    <circle cx="1230" cy="390" r="7"/>
  </g>
  <text x="1000" y="344" class="small" text-anchor="middle" fill="#92400e">q = 1/4</text>
  <text x="1000" y="477" class="small" text-anchor="middle">жёлтая полоса — U₁/₈(1/4); точки на границе не входят</text>
  <rect x="737" y="513" width="580" height="91" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="758" y="548" class="math">1/n ∈ (1/8, 3/8)  ⇒  8/3 &lt; n &lt; 8.</text>
  <text x="758" y="579" class="body">Натуральных n здесь только пять: 3, 4, 5, 6, 7.</text>
  <text x="737" y="642" class="body">Для любого q &gt; 0 работает δ = q/2:</text>
  <text x="737" y="672" class="math">q/2 &lt; 1/n  ⇒  n &lt; 2/q, то есть таких n конечное число.</text>
  <text x="737" y="716" class="body">Если q &lt; 0, окрестность радиуса |q|/2 целиком левее 0 и не содержит X.</text>

  <rect x="55" y="792" width="1290" height="92" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="82" y="828" class="head">Итог</text>
  <text x="180" y="829" class="math">0 — предельная точка; для каждого q ≠ 0 найдётся окрестность с конечным числом точек X.</text>
  <text x="180" y="858" class="small">По определению предельной точки этого достаточно, чтобы заключить: 0 — единственная предельная точка множества {1/n}.</text>
</svg>
