<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1780" viewBox="0 0 1800 1780" role="img" aria-labelledby="title desc">
  <title id="title">Почему фундаментальная последовательность ограничена</title>
  <desc id="desc">Пояснение шага Зорича: конечное начало состоит из конечного числа членов, а бесконечный хвост ограничен оценкой Коши. Приведен числовой пример возрастающей последовательности x_n=1-1/n.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#24344d"/></marker>
    <style>
      text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17243a}
      .title{font-size:35px;font-weight:700}.subtitle{font-size:20px;fill:#53647c}.head{font-size:25px;font-weight:700}
      .body{font-size:20px}.small{font-size:17px;fill:#46566d}.tiny{font-size:15px;fill:#46566d}.formula{font-size:23px;font-family:'DejaVu Sans',Arial,sans-serif}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.axis{stroke:#24344d;stroke-width:3}.tick{stroke:#24344d;stroke-width:2}
      .blue{fill:#1976a5}.green{fill:#21845b}.orange{fill:#bd6a12}.red{fill:#b53b45}.muted{fill:#66758a}
    </style>
  </defs>
  <rect width="1800" height="1780" fill="#f5f7fa"/>
  <text x="70" y="68" class="title">Почему фундаментальная последовательность ограничена</text>
  <text x="70" y="107" class="subtitle">Шаг из доказательства теоремы 4, Зорич: конечное начало + ограниченный бесконечный хвост</text>

  <rect x="60" y="135" width="1680" height="760" rx="18" class="card"/>
  <text x="95" y="180" class="head">Общий аргумент Зорича</text>
  <text x="95" y="220" class="body">Для заданного ε&gt;0 найдём N так, что для m,k≥N:</text>
  <text x="95" y="259" class="formula green">|xₘ−xₖ|&lt;ε/3.</text>
  <text x="315" y="259" class="body">Фиксируем m=N. Тогда при каждом k&gt;N получаем (1):</text>
  <text x="95" y="301" class="formula green">x_N−ε/3 &lt; xₖ &lt; x_N+ε/3.     (1)</text>
  <text x="620" y="301" class="small">Одни и те же границы для всех k&gt;N.</text>

  <!-- Infinite tail: all its points stay inside the same finite interval. -->
  <rect x="410" y="349" width="660" height="78" rx="14" fill="#e8f4ed" stroke="#21845b" stroke-width="2"/>
  <line x1="410" y1="336" x2="410" y2="443" stroke="#21845b" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="1070" y1="336" x2="1070" y2="443" stroke="#21845b" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="740" y1="332" x2="740" y2="448" stroke="#1976a5" stroke-width="4"/>
  <line x1="330" y1="388" x2="1160" y2="388" class="axis" marker-end="url(#arrow)"/>
  <circle cx="480" cy="388" r="8" fill="#21845b"/><circle cx="590" cy="388" r="8" fill="#21845b"/>
  <circle cx="740" cy="388" r="8" fill="#1976a5"/><circle cx="855" cy="388" r="8" fill="#21845b"/>
  <circle cx="980" cy="388" r="8" fill="#21845b"/><circle cx="1035" cy="388" r="8" fill="#21845b"/>
  <text x="410" y="468" text-anchor="middle" class="small">x_N−ε/3</text>
  <text x="740" y="468" text-anchor="middle" class="small blue">x_N</text>
  <text x="1070" y="468" text-anchor="middle" class="small">x_N+ε/3</text>
  <text x="855" y="365" text-anchor="middle" class="body green" font-weight="700">xₖ</text>
  <text x="1190" y="366" class="body green" font-weight="700">Хвост: xₙ₊₁, xₙ₊₂, …</text>
  <text x="1190" y="399" class="small">членов бесконечно много,</text>
  <text x="1190" y="429" class="small">и каждый внутри интервала.</text>

  <line x1="95" y1="498" x2="1700" y2="498" stroke="#e0e6ed" stroke-width="2"/>
  <text x="95" y="542" class="head">Отдельно учитываем конечное начало</text>
  <text x="95" y="580" class="body">Индексы, не превосходящие N, дают ровно N членов: F={x₁,x₂,…,x_N}. Это конечное множество.</text>
  <text x="95" y="619" class="formula">M₀=max{|x₁|,|x₂|,…,|x_N|}</text>
  <text x="550" y="619" class="body">ограничивает каждый из первых N членов.</text>
  <text x="95" y="660" class="body">Для хвоста из (1):  |xₖ|≤|x_N|+ε/3  при k&gt;N.</text>
  <text x="95" y="700" class="formula blue">M=max{M₀, |x_N|+ε/3}  ⇒  |xₖ|≤M для всех k.</text>
  <text x="95" y="751" class="small">На схеме перечислены две части: первые N членов и бесконечный хвост после N.</text>
  <text x="95" y="790" class="body" font-weight="700">Бесконечный хвост может быть ограниченным: его бесконечность означает число членов, а ограниченность — их расположение.</text>
  <text x="95" y="840" class="small">В доказательстве не предполагается, что последовательность возрастает: (1) следует только из фундаментальности.</text>

  <rect x="60" y="920" width="1680" height="790" rx="18" class="card"/>
  <text x="95" y="965" class="head">Числовая иллюстрация: возрастающая последовательность xₙ=1−1/n</text>
  <text x="95" y="1005" class="body">Она стремится к 1 снизу. Возьмём N=5 и ε=3/5, так что ε/3=1/5.</text>
  <text x="95" y="1045" class="formula green">x₅=4/5,     x₅−ε/3=3/5,     x₅+ε/3=1.</text>
  <text x="95" y="1082" class="small">По (1), каждый член хвоста с k&gt;5 лежит в (3/5,1). Таких членов бесконечно много.</text>

  <!-- Exact scale: horizontal coordinate x = 250 + 1000*value. -->
  <rect x="850" y="1155" width="400" height="112" rx="14" fill="#e8f4ed" stroke="#21845b" stroke-width="2"/>
  <line x1="850" y1="1135" x2="850" y2="1280" stroke="#21845b" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="1250" y1="1135" x2="1250" y2="1280" stroke="#21845b" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="1050" y1="1132" x2="1050" y2="1284" stroke="#1976a5" stroke-width="4"/>
  <line x1="190" y1="1210" x2="1515" y2="1210" class="axis" marker-end="url(#arrow)"/>
  <!-- First five terms, the finite initial segment. -->
  <circle cx="250" cy="1210" r="9" fill="#bd6a12"/><circle cx="750" cy="1210" r="9" fill="#bd6a12"/>
  <circle cx="916.67" cy="1210" r="9" fill="#bd6a12"/><circle cx="1000" cy="1210" r="9" fill="#bd6a12"/><circle cx="1050" cy="1210" r="10" fill="#1976a5"/>
  <!-- Some of the infinitely many later terms. -->
  <circle cx="1083.33" cy="1210" r="8" fill="#21845b"/><circle cx="1107.14" cy="1210" r="8" fill="#21845b"/>
  <circle cx="1125" cy="1210" r="8" fill="#21845b"/><circle cx="1150" cy="1210" r="8" fill="#21845b"/><circle cx="1230" cy="1210" r="8" fill="#21845b"/>
  <text x="850" y="1130" text-anchor="middle" class="small green">3/5 (open boundary)</text>
  <text x="1050" y="1130" text-anchor="middle" class="small blue">x₅=4/5</text>
  <text x="1250" y="1130" text-anchor="middle" class="small green">1 (open boundary)</text>
  <text x="250" y="1180" text-anchor="middle" class="tiny orange">x₁=0</text>
  <text x="750" y="1180" text-anchor="middle" class="tiny orange">x₂=1/2</text>
  <text x="916" y="1158" text-anchor="middle" class="tiny orange">x₃=2/3</text>
  <text x="1000" y="1180" text-anchor="middle" class="tiny orange">x₄=3/4</text>
  <text x="1083" y="1237" text-anchor="middle" class="tiny green">x₆=5/6</text>
  <text x="1150" y="1180" text-anchor="middle" class="tiny green">x₁₀=9/10</text>
  <text x="1230" y="1237" text-anchor="middle" class="tiny green">x₅₀=49/50</text>
  <line x1="250" y1="1260" x2="250" y2="1270" class="tick"/><line x1="750" y1="1260" x2="750" y2="1270" class="tick"/>
  <line x1="850" y1="1260" x2="850" y2="1270" class="tick"/><line x1="1050" y1="1260" x2="1050" y2="1270" class="tick"/><line x1="1250" y1="1260" x2="1250" y2="1270" class="tick"/>
  <text x="250" y="1293" text-anchor="middle" class="tiny">0</text><text x="750" y="1293" text-anchor="middle" class="tiny">1/2</text>
  <text x="850" y="1293" text-anchor="middle" class="tiny">3/5</text><text x="1050" y="1293" text-anchor="middle" class="tiny">4/5</text><text x="1250" y="1293" text-anchor="middle" class="tiny">1</text>

  <rect x="95" y="1325" width="1585" height="132" rx="14" fill="#f3f6fa" stroke="#d6dee8" stroke-width="2"/>
  <text x="125" y="1368" class="body"><tspan class="orange" font-weight="700">Оранжевые точки:</tspan> конечное начало x₁,…,x₅; оно ограничено (здесь 0≤xₙ≤4/5).</text>
  <text x="125" y="1410" class="body"><tspan class="green" font-weight="700">Зелёные точки:</tspan> лишь несколько членов бесконечного хвоста x₆,x₇,…; все лежат в (3/5,1).</text>
  <text x="95" y="1505" class="formula">В примере вся последовательность лежит в [0,1); бесконечное число членов не мешает ей быть ограниченной.</text>
  <text x="95" y="1553" class="small">Общая оценка Зорича не использует монотонность: для любого фундаментального хвоста работает один интервал из (1).</text>
  <text x="95" y="1630" class="head green">Итог шага: конечное начало ограничено, бесконечный хвост ограничен, значит ограничена вся последовательность.</text>
</svg>
