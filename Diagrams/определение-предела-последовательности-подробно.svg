<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc">
  <title id="title">Определение предела последовательности: подробная иллюстрация</title>
  <desc id="desc">Иллюстрация определения предела на примере x_n равного 1 плюс 1 делённое на n, с пределом 1, epsilon равным одной четверти и N равным 4. Показана окрестность на числовой прямой, первые члены и хвост при n больше N.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#24344d"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#1976a5"/></marker>
    <style>
      text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17243a}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:20px;fill:#506078}
      .head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#46566d}.tiny{font-size:14px;fill:#46566d}
      .formula{font-size:25px;font-family:'DejaVu Sans',Arial,sans-serif}.axis{stroke:#24344d;stroke-width:3}.tick{stroke:#24344d;stroke-width:2}
      .card{fill:#fff;stroke:#ccd5e0;stroke-width:2}.blue{fill:#1976a5}.green{fill:#21845b}.orange{fill:#bd6a12}.red{fill:#b53b45}
    </style>
  </defs>
  <rect width="1600" height="1390" fill="#f5f7fa"/>
  <text x="70" y="68" class="title">Определение предела последовательности</text>
  <text x="70" y="104" class="subtitle">Что означает: начиная с некоторого номера, все члены последовательности попадают в ε-окрестность A</text>

  <rect x="60" y="135" width="1480" height="180" rx="18" class="card"/>
  <text x="95" y="178" class="head">Формулировка Зорича</text>
  <text x="95" y="226" class="formula">xₙ → A  ⇔  ∀ ε &gt; 0  ∃ N ∈ ℕ  ∀ n &gt; N:  |xₙ − A| &lt; ε</text>
  <text x="95" y="268" class="body">После выбора любой точности ε можно найти порог N, после которого каждый член xₙ ближе к A, чем на ε.</text>
  <text x="95" y="296" class="small">Кванторы важны: N зависит от ε; затем условие должно выполняться для всех n &gt; N.</text>

  <rect x="60" y="338" width="1480" height="395" rx="18" class="card"/>
  <text x="95" y="382" class="head">Пример на числовой прямой</text>
  <text x="95" y="414" class="body">xₙ = 1 + 1/n,  A = 1,  ε = 1/4,  N = 4. Значит, проверяем все n &gt; 4.</text>
  <text x="95" y="448" class="small">Требуемая окрестность: (A − ε, A + ε) = (3/4, 5/4). Граничные точки не входят.</text>

  <!-- Number axis: 0.65 maps to x=180 and 2.1 maps to x=1405; the scale is linear. -->
  <rect x="264" y="487" width="422" height="114" rx="12" fill="#dff3e9" stroke="#21845b" stroke-width="2"/>
  <text x="475" y="479" text-anchor="middle" class="small green">ε-окрестность A</text>
  <line x1="180" y1="570" x2="1405" y2="570" class="axis" marker-end="url(#arrow)"/>
  <line x1="264" y1="530" x2="264" y2="616" stroke="#21845b" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="686" y1="530" x2="686" y2="616" stroke="#21845b" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="475" y1="519" x2="475" y2="620" stroke="#1976a5" stroke-width="4"/>
  <circle cx="264" cy="570" r="8" fill="#fff" stroke="#21845b" stroke-width="3"/>
  <circle cx="686" cy="570" r="8" fill="#fff" stroke="#21845b" stroke-width="3"/>
  <text x="264" y="646" text-anchor="middle" class="body">3/4</text>
  <text x="475" y="674" text-anchor="middle" class="body blue" font-weight="700">A = 1</text>
  <text x="686" y="646" text-anchor="middle" class="body">5/4</text>

  <!-- x_n locations on the same calibrated number line -->
  <circle cx="1319" cy="570" r="8" fill="#bd6a12"/>
  <line x1="1319" y1="570" x2="1319" y2="540" stroke="#bd6a12" stroke-width="2"/>
  <text x="1319" y="527" text-anchor="middle" class="small orange">x₁ = 2</text>
  <circle cx="897" cy="570" r="8" fill="#bd6a12"/><line x1="897" y1="570" x2="897" y2="540" stroke="#bd6a12" stroke-width="2"/><text x="897" y="527" text-anchor="middle" class="small orange">x₂ = 3/2</text>
  <circle cx="756" cy="570" r="8" fill="#bd6a12"/><line x1="756" y1="570" x2="756" y2="540" stroke="#bd6a12" stroke-width="2"/><text x="756" y="527" text-anchor="middle" class="small orange">x₃ = 4/3</text>
  <circle cx="686" cy="570" r="8" fill="#bd6a12"/><line x1="686" y1="570" x2="686" y2="600" stroke="#bd6a12" stroke-width="2"/><text x="699" y="624" class="tiny orange">x₄ = 5/4 (граница)</text>
  <circle cx="644" cy="570" r="8" fill="#21845b"/><line x1="644" y1="570" x2="644" y2="548" stroke="#21845b" stroke-width="2"/><text x="644" y="548" text-anchor="middle" class="tiny green">x₅ = 6/5</text>
  <circle cx="616" cy="570" r="6" fill="#21845b"/><circle cx="588" cy="570" r="5" fill="#21845b"/><circle cx="560" cy="570" r="4" fill="#21845b"/>
  <text x="520" y="590" class="tiny green">x₆, x₇, … → A</text>
  <text x="105" y="698" class="small">Первые члены могут быть вне окрестности. Для n &gt; 4 имеем 1/n &lt; 1/4, поэтому 1 &lt; xₙ &lt; 5/4.</text>

  <rect x="60" y="756" width="1480" height="370" rx="18" class="card"/>
  <text x="95" y="800" class="head">Индексы и члены последовательности</text>
  <text x="95" y="832" class="small">Точки ниже показывают xₙ по вертикали; зелёная полоса — значения внутри ε-окрестности (3/4, 5/4).</text>
  <!-- Index plot area -->
  <rect x="305" y="945" width="1080" height="50" fill="#e5f5ed" stroke="#b8ddca" stroke-width="1"/>
  <text x="118" y="948" class="small">5/4</text><text x="118" y="976" class="small">A = 1</text><text x="118" y="1001" class="small">3/4</text>
  <line x1="305" y1="945" x2="1385" y2="945" stroke="#21845b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="305" y1="970" x2="1385" y2="970" stroke="#1976a5" stroke-width="2"/>
  <line x1="305" y1="996" x2="1385" y2="996" stroke="#21845b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="305" y1="1025" x2="1385" y2="1025" class="axis" marker-end="url(#arrow)"/>
  <text x="1395" y="1032" class="small">n</text>
  <!-- y = 995 - 100(value - 0.75): 5/4 is upper edge, A=1, 3/4 lower edge. -->
  <line x1="350" y1="1020" x2="350" y2="1029" class="tick"/><circle cx="350" cy="870" r="7" fill="#bd6a12"/><text x="350" y="1054" text-anchor="middle" class="small">1</text>
  <line x1="485" y1="1020" x2="485" y2="1029" class="tick"/><circle cx="485" cy="920" r="7" fill="#bd6a12"/><text x="485" y="1054" text-anchor="middle" class="small">2</text>
  <line x1="620" y1="1020" x2="620" y2="1029" class="tick"/><circle cx="620" cy="936.7" r="7" fill="#bd6a12"/><text x="620" y="1054" text-anchor="middle" class="small">3</text>
  <line x1="755" y1="1020" x2="755" y2="1029" class="tick"/><circle cx="755" cy="945" r="7" fill="#bd6a12"/><text x="755" y="1054" text-anchor="middle" class="small">4</text>
  <line x1="890" y1="1020" x2="890" y2="1029" class="tick"/><circle cx="890" cy="950" r="7" fill="#21845b"/><text x="890" y="1054" text-anchor="middle" class="small">5</text>
  <line x1="1025" y1="1020" x2="1025" y2="1029" class="tick"/><circle cx="1025" cy="953.3" r="7" fill="#21845b"/><text x="1025" y="1054" text-anchor="middle" class="small">6</text>
  <line x1="1160" y1="1020" x2="1160" y2="1029" class="tick"/><circle cx="1160" cy="955.3" r="7" fill="#21845b"/><text x="1160" y="1054" text-anchor="middle" class="small">7</text>
  <line x1="1295" y1="1020" x2="1295" y2="1029" class="tick"/><circle cx="1295" cy="957.5" r="7" fill="#21845b"/><text x="1295" y="1054" text-anchor="middle" class="small">8</text>
  <line x1="822" y1="855" x2="822" y2="1072" stroke="#b53b45" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="822" y="1085" text-anchor="middle" class="small red">N = 4</text>
  <text x="95" y="1102" class="small orange">n ≤ N: не обязаны попадать в ε-окрестность</text>
  <text x="944" y="1102" class="small green">n &gt; N: все члены внутри полосы</text>

  <rect x="60" y="1148" width="1480" height="185" rx="18" fill="#edf2f8" stroke="#ccd5e0" stroke-width="2"/>
  <text x="95" y="1192" class="head">Что именно доказывает пример</text>
  <text x="95" y="1230" class="body">Для выбранного ε = 1/4 подходит N = 4: каждый n &gt; 4 даёт |xₙ − 1| = 1/n &lt; 1/4.</text>
  <text x="95" y="1265" class="body">Определение требует такого обоснования для любого ε &gt; 0; один выбранный ε иллюстрирует кванторы, но не доказывает их все.</text>
  <text x="95" y="1305" class="small">В общем виде: «хвост» последовательности {xₙ : n &gt; N} целиком лежит в интервале (A − ε, A + ε).</text>
</svg>
